name: pages
on:
  push:
    branches: [main]
  schedule:
    - cron: '17 8 * * *'
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      # The evidence gate falls back to git history for pinned code
      # hashes (release.verify_training_binding); a depth-1 checkout
      # silently breaks that fallback (shallow-clone incident,
      # REVIEW.md session 4).
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
      - name: Install validation and site dependencies
        run: pip install -r requirements.txt
      - name: Verify committed data
        run: python scripts/fetch_data.py --no-features
      - name: Refresh official source feed (failures stay visibly stale)
        run: python scripts/refresh_sources.py
      - name: Revalidate publications and build evidence site
        run: python scripts/build_site.py
      - uses: actions/upload-artifact@v4
        with:
          name: dated-official-feed
          path: reports/official_feed.json
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: docs
  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
